name: Fast Manual LDPlayer & Interactive RDP Test

on:
  workflow_dispatch:
    inputs:
      enable_rdp:
        description: 'Enable RDP (Remote Desktop) for interactive GUI access (true/false)'
        required: false
        default: 'false'
      ngrok_auth_token:
        description: 'Optional Ngrok Token for RDP Tunneling (leave blank if not using ngrok)'
        required: false
        default: ''
      tailscale_auth_key:
        description: 'Optional Tailscale Auth Key (leave blank if not using Tailscale)'
        required: false
        default: ''

jobs:
  fast-ldplayer-test:
    name: Fast LDPlayer 9 Windows Test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Windows User & Enable RDP
        shell: powershell
        run: |
          Write-Host "=== [1/5] Enabling Windows Remote Desktop (RDP) ===" -ForegroundColor Cyan
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # Configure runneradmin user credentials
          $Password = ConvertTo-SecureString "LDPlayer1234!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Write-Host "[+] Windows RDP is configured." -ForegroundColor Green
          Write-Host "    Username: runneradmin" -ForegroundColor Green
          Write-Host "    Password: LDPlayer1234!" -ForegroundColor Green

      - name: Install Android Platform-Tools (ADB)
        shell: powershell
        run: |
          Write-Host "=== [2/5] Installing Android Platform-Tools (ADB) ===" -ForegroundColor Cyan
          $adbZip = "$env:TEMP\platform-tools.zip"
          if (-not (Test-Path "C:\platform-tools\adb.exe")) {
              Write-Host "Downloading Google Platform-Tools..." -ForegroundColor Yellow
              & curl.exe -# -fSL -o $adbZip "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
              Expand-Archive -Path $adbZip -DestinationPath "C:\" -Force
          }
          Write-Host "[+] ADB is ready at C:\platform-tools\adb.exe" -ForegroundColor Green
          echo "C:\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH += ";C:\platform-tools"
          & C:\platform-tools\adb.exe version

      - name: Setup Tailscale Tunnel (If Auth Key Provided)
        if: ${{ github.event.inputs.tailscale_auth_key != '' }}
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ github.event.inputs.tailscale_auth_key }}

      - name: Setup Ngrok RDP Tunnel (If Ngrok Token Provided)
        if: ${{ github.event.inputs.ngrok_auth_token != '' }}
        shell: powershell
        run: |
          Write-Host "=== Setting up Ngrok RDP Tunnel ===" -ForegroundColor Cyan
          curl.exe -# -fSL -o ngrok.zip https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip
          Expand-Archive ngrok.zip -DestinationPath . -Force
          .\ngrok.exe config add-authtoken "${{ github.event.inputs.ngrok_auth_token }}"
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow
          Start-Sleep -Seconds 5
          try {
              $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels
              Write-Host "`n========================================================" -ForegroundColor Yellow
              Write-Host ">>> CONNECT TO RDP VIA NGROK: $($tunnels[0].public_url)" -ForegroundColor Green
              Write-Host ">>> Username: runneradmin" -ForegroundColor Green
              Write-Host ">>> Password: LDPlayer1234!" -ForegroundColor Green
              Write-Host "========================================================`n" -ForegroundColor Yellow
          } catch {
              Write-Host "[-] Could not retrieve ngrok tunnel URL: $_" -ForegroundColor DarkYellow
          }

      - name: Download & Extract LDPlayer 9 with Live Progress Bar
        shell: powershell
        run: |
          $env:PATH += ";C:\platform-tools"
          Write-Host "=== [3/5] Downloading LDPlayer 9 (760MB) ===" -ForegroundColor Cyan
          $installerPath = "$env:TEMP\LDPlayer9.exe"
          
          if (-not (Test-Path $installerPath)) {
              & curl.exe -# -fSL --retry 3 --connect-timeout 30 -o $installerPath "https://encdn.ldmnq.com/download/package/LDPlayer9.exe"
          }
          
          $sizeMb = [math]::Round((Get-Item $installerPath).Length / 1MB, 2)
          Write-Host "[+] LDPlayer9.exe downloaded ($sizeMb MB)" -ForegroundColor Green

          Write-Host "`n=== [4/5] Extracting LDPlayer 9 with Live Progress ===" -ForegroundColor Cyan
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
              Write-Host "Extracting archive into C:\LDPlayer\LDPlayer9 (showing live extraction progress)..." -ForegroundColor Yellow
              & $sevenZip x -y -bsp1 "-oC:\LDPlayer\LDPlayer9" $installerPath
          }

          # Search for executables recursively
          $foundLd = Get-ChildItem -Path @("C:\LDPlayer", "C:\leidian", "$env:ProgramFiles\LDPlayer", "$env:TEMP") -Filter "*console.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          if (-not $foundLd) {
              $foundLd = Get-ChildItem -Path @("C:\LDPlayer", "C:\leidian", "$env:ProgramFiles\LDPlayer", "$env:TEMP") -Filter "*player.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }

          if ($foundLd) {
              Write-Host "`n[+] FOUND LDPlayer Executable: $foundLd" -ForegroundColor Green
              Write-Host "Launching instance 0..." -ForegroundColor Yellow
              Start-Process -FilePath $foundLd -ArgumentList "launch --index 0" -NoNewWindow
              Write-Host "[+] Launch command dispatched!" -ForegroundColor Green
          } else {
              Write-Host "`n[-] Executables found under C:\LDPlayer:" -ForegroundColor Yellow
              Get-ChildItem "C:\LDPlayer" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "   $($_.FullName)" }
          }

      - name: Verify ADB Connection & Device State
        shell: powershell
        run: |
          $env:PATH += ";C:\platform-tools"
          Write-Host "=== [5/5] Polling ADB Device Connection (127.0.0.1:5555) ===" -ForegroundColor Cyan
          & C:\platform-tools\adb.exe start-server
          
          $connected = $false
          for ($i = 1; $i -le 12; $i++) {
              & C:\platform-tools\adb.exe connect 127.0.0.1:5555 | Out-Null
              $devices = & C:\platform-tools\adb.exe devices
              Write-Host "Poll [$i/12] Device status: $($devices -join ' ')"
              if ($devices -match "127\.0\.0\.1:5555\s+device") {
                  $connected = $true
                  Write-Host "`n========================================================" -ForegroundColor Green
                  Write-Host "[+] SUCCESS: LDPlayer Android is ONLINE and CONNECTED!" -ForegroundColor Green
                  $model = & C:\platform-tools\adb.exe -s 127.0.0.1:5555 shell getprop ro.product.model
                  $androidVer = & C:\platform-tools\adb.exe -s 127.0.0.1:5555 shell getprop ro.build.version.release
                  Write-Host "    Device Model: $model" -ForegroundColor Green
                  Write-Host "    Android OS: Android $androidVer" -ForegroundColor Green
                  Write-Host "========================================================`n" -ForegroundColor Green
                  break
              }
              Start-Sleep -Seconds 5
          }

      - name: Hold Open for Interactive Testing (If Enabled)
        if: ${{ github.event.inputs.enable_rdp == 'true' || github.event.inputs.ngrok_auth_token != '' || github.event.inputs.tailscale_auth_key != '' }}
        shell: powershell
        run: |
          $env:PATH += ";C:\platform-tools"
          Write-Host "=== Session Hold-Open for Interactive Remote Testing ===" -ForegroundColor Cyan
          Write-Host ">>> Runner is holding open for 45 minutes." -ForegroundColor Green
          Write-Host ">>> Connect via RDP: Username: runneradmin | Password: LDPlayer1234!" -ForegroundColor Green
          $timeout = [DateTime]::UtcNow.AddMinutes(45)
          while ([DateTime]::UtcNow -lt $timeout) {
              $devices = & C:\platform-tools\adb.exe devices
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Live Device Status: $($devices -join ' ')"
              Start-Sleep -Seconds 30
          }
