name: Fast Manual LDPlayer & Interactive RDP Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  fast-ldplayer-test:
    name: Fast LDPlayer 9 Windows Test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Windows User & Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          $Password = ConvertTo-SecureString "LDPlayer1234!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Write-Host "[+] Windows RDP configured (runneradmin / LDPlayer1234!)" -ForegroundColor Green

      - name: Execute Fast LDPlayer 9 Automation
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/run_manual_ldplayer_test.ps1
